# uhub configuration for the ADCS path.
#
# The same permissive hub as uhub.conf, with TLS turned on: this is the one
# most public hubs look like, and the one DOSy++ cannot talk to directly
# because it contains no crypto. A relay goes in front -- stunnel, or
# tools/tlsrelay.py -- and the client dials the relay's plaintext side.
server_bind_addr = any
server_port = 1511
hub_name = DOSyPP ADCS Hub
hub_description = uhub, an independent ADC implementation

max_users = 100
registered_users_only = no

# No barriers to entry -- a share minimum would reject a client that shares
# nothing yet, which is every build before Phase 5.
limit_min_share = 0
limit_min_slots = 0
limit_max_hubs = 0

# TLS ON: uhub generates a self-signed certificate at first start and
# announces itself as adcs://. This is the ADCS path, reached through
# tools/tlsrelay.py -- see docs/STUNNEL.md.
tls_enable = 1

# And REQUIRE it. With tls_enable alone uhub accepts both on one port, which
# would make the relay test pass just as well with no TLS anywhere: the
# plaintext dial that is supposed to fail would succeed. This is also what a
# public ADCS-only hub looks like.
tls_require = 1

# The ACL file. uhub's shipped example denies the nicks "guest", "user" and
# "admin", which would break a correct login test for reasons nothing to do
# with the client.
file_acl = /etc/uhub/users.conf

show_banner = yes

file_plugins = /etc/uhub/plugins.conf
