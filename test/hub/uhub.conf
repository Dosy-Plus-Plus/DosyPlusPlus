# uhub configuration for DOSy++ conformance testing.
#
# Deliberately permissive: no TLS, no share minimum, no client whitelist.
# Public hubs enforce all three; we want the protocol tested, not the policy.
server_bind_addr = any
server_port = 1511
hub_name = DOSyPP Conformance Hub
hub_description = uhub, an independent ADC implementation

max_users = 100
registered_users_only = no

# No barriers to entry -- a share minimum would reject a client that shares
# nothing yet, which is every build before Phase 5.
limit_min_share = 0
limit_min_slots = 0
limit_max_hubs = 0

# TLS OFF. uhub generates a self-signed certificate and announces itself as
# adcs:// by default; with tls_enable=1 it accepts both on one port, but we
# want the plaintext path under test, not OpenSSL's.
tls_enable = 0

# The ACL file. uhub's shipped example denies the nicks "guest", "user" and
# "admin", which would break a correct login test for reasons nothing to do
# with the client.
file_acl = /etc/uhub/users.conf

show_banner = yes

file_plugins = /etc/uhub/plugins.conf
