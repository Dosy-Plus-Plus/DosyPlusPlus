# DOSy++ development profile for DOSBox-X.
#
#   cd dosbox-x && dosbox-x -conf dosbox-x.conf
#
# Mounts ./c as C:, emulates an NE2000 ISA card, and drops you at a prompt
# with the packet driver loaded. See docs/DOSBOX.md for the slirp/pcap
# tradeoff -- it decides whether active-mode transfers work.

[sdl]
fullscreen     = false
output         = opengl
autolock       = false

[dosbox]
title          = DOSy++ dev
machine        = svga_s3
memsize        = 16
captures       = capture

[render]
aspect         = true
# 'none' keeps the text crisp; switch to a CRT shader when showing off the UI.
glshader       = none

[cpu]
# 'dynamic' for day-to-day speed. Note that cputype=486_prefetch is NOT
# compatible with the dynamic core (DOSBox-X exits outright), so the
# prefetch-accurate 486 lives in the cycle-limited profile instead --
# see docs/DOSBOX.md. Use that before believing any throughput number.
core           = dynamic
cputype        = 486
cycles         = max

[dos]
ver            = 7.1
# Long filename support is OFF deliberately: DOSy++ must cope with real 8.3
# constraints (see src/share/namemap.c). Turning this on
# would hide the exact class of bug we most need to find.
lfn            = false

[ne2000]
ne2000         = true
nicbase        = 300
nicirq         = 10
macaddr        = AC:DE:48:88:99:AA
# backend: 'slirp' = user-mode NAT, no privileges, outbound only (passive
#          mode only -- no inbound peer connections)
#          'pcap'  = bridged to a real interface, needs sudo, required to
#          test active mode and CTM
backend        = slirp

[serial]
serial1        = disabled
serial2        = disabled

[speaker]
pcspeaker      = true

[sblaster]
sbtype         = sb16

# Premium game audio: the Roland path.
#
# An MPU-401 is a serial port, not an instrument -- a game writes MIDI
# notes into it and something else makes the sound. In 1994 that something
# was an MT-32 or an SC-55 on the end of a cable; here it is FluidSynth
# with a SoundFont, which DOSBox-X links in.
#
# The SoundFont is fetched, not committed:  make sf2
# Path is relative to where you start DOSBox-X, which the docs say is this
# directory:  cd dosbox-x && dosbox-x -conf dosbox-x.conf
#
# fluid.driver is deliberately unset: FluidSynth then opens your sound card
# directly. It does NOT go through DOSBox-X's mixer, which is worth knowing
# twice over -- the mixer's volume and its wave capture have no effect on
# MIDI, and make dos-midi-check has to set fluid.driver=file to have
# anything to measure.
#
# Own MT-32 ROMs? Then this is the better sound for anything written before
# General MIDI:
#   mididevice   = mt32
#   mt32.romdir  = ./mt32
# The ROMs are not redistributable, so nothing here fetches them.
[midi]
mpu401         = intelligent
mididevice     = fluidsynth
fluid.soundfont = sf2/MuseScore_General.sf3

[autoexec]
mount c .\c
c:
@echo off
echo.
echo  DOSy++ dev box.  Loading NE2000 packet driver...
echo.
rem Packet driver is not redistributable here -- see docs/DOSBOX.md.
rem Expected: NE2000.COM at software int 0x60, io 0x300, irq 10.
if exist ne2000.com ne2000 0x60 10 0x300
if not exist ne2000.com echo  !! NE2000.COM missing - see docs/DOSBOX.md
echo.
echo  Try:  dosypp 10.0.2.2        (slirp: host is 10.0.2.2)
echo.
