# Watt-32 configuration for the DOSy++ dev box.
# DHCP first; the static block below is a fallback for pcap on a LAN
# without DHCP, or for real hardware.

my_ip    = dhcp

# --- static fallback: comment out my_ip above and uncomment these ---
# my_ip    = 192.168.1.90
# netmask  = 255.255.255.0
# gateway  = 192.168.1.1
# nameserver = 192.168.1.1

# Keep resolver timeouts short: a 10-second DNS stall feels like a hang
# on an 80x25 screen with no spinner.
domain.suffix = lan
